name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test Python
        run: python -m pytest --cov=app --cov=hotel_finder

      - name: Lint Python
        run: python -m ruff check .

      - name: Compile Python
        run: python -m compileall -q app.py hotel_finder

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build hostable frontend
        working-directory: frontend
        run: npm run build:hostable

      - name: Verify static bundle references
        run: python scripts/verify_static.py --check

      - name: Require committed generated assets
        run: git diff --exit-code -- static

services:
  - type: web
    name: hotel-finder
    runtime: python
    # Build the SPA into ./static, then install Python deps. Render images
    # ship Node by default; if not, fall back to skipping the SPA build (the
    # repository already includes a prebuilt bundle in static/).
    buildCommand: |
      if command -v npm >/dev/null 2>&1; then
        cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
      fi
      pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
